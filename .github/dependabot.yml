# Dependabot — keeps the SHA-pinned actions and the dev toolchain fresh.
#
# The actions in .github/workflows/*.yml are pinned to full commit SHAs so a
# moved tag can't change what runs (deploy-web.yml publishes straight to the
# live PWA). Pinning without automation just rots, so Dependabot maintains the
# pins: it rewrites the SHA *and* the trailing `# vN` comment together.
#
# Everything here is a PULL REQUEST, never an auto-merge — CI's full gate
# (build, lint, typecheck, vitest, smoke:ci, data validators) is what decides
# whether a bump is safe, and the owner merges.

version: 2
updates:
  # ── GitHub Actions: the supply-chain reason this file exists ──
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      # One PR for the whole action set — they move together and each needs
      # the same CI proof anyway.
      actions:
        patterns:
          - "*"

  # ── npm: dev toolchain only (there are no runtime deps) ──
  # The SHIPPED React is the vendored app/src/main/assets/react.min.js, NOT the
  # npm package — every entry in package.json is devDependencies, used for
  # build/test/lint. So an npm bump here can break the gate but cannot ship a
  # regression to a reader by itself.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch/minor land as one PR. Majors are deliberately excluded from the
      # group so each arrives alone and gets judged on its own. That has worked:
      # jsdom 30 and typescript 7 were declined on 2026-07-30 as churn and then
      # ADOPTED on 2026-08-04 once they were worth it. eslint 10 is the one that
      # never could be — see the ignore block below; it is blocked upstream by a
      # peer cap, not by taste.
      dev-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # esbuild's target contract is load-bearing: `--target=chrome108` is
      # Permanent Rule 6, and a major could change output for the WebView
      # floor. Patch/minor still flow through the group above.
      - dependency-name: esbuild
        update-types: ["version-update:semver-major"]

      # ── eslint 10: BLOCKED UPSTREAM, not declined (2026-08-11) ──
      # eslint-plugin-react's newest published release (7.37.5, and it IS the
      # latest — the `next` tag points at 7.8.0-rc.0, an OLDER prerelease that
      # peers on eslint ^3||^4) caps its eslint peer at:
      #     ^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7
      # so `npm ci` fails ERESOLVE on eslint 10 and the PR cannot go green. It had
      # been reopened weekly and sitting red ever since, which trains everyone to
      # ignore a red check — the one signal that has to stay meaningful.
      #
      # Ignoring the MAJOR only. eslint 9 patch/minor still flow through the
      # dev-minor group above, so the linter keeps getting fixes.
      #
      # NOT a policy judgement about eslint 10, and NOT worked around: forcing it
      # with npm `overrides` would install a combination the plugin's maintainers
      # have not validated, and this repo's lint gate is zero-warning and
      # load-bearing (500+ generated globals, 59 documented exhaustive-deps
      # exceptions). A silently mis-firing rule is worse than an old linter.
      #
      # UNBLOCK CONDITION, so this does not rot: eslint-plugin-react publishes a
      # release whose eslint peer range includes ^10. Check with
      #     npm view eslint-plugin-react peerDependencies.eslint
      # then delete these two entries and let the PR return. eslint-plugin-react-hooks
      # is already there (7.1.1 peers on ^10), so react is the only blocker left.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @eslint/js ships in lockstep with eslint, so a lone 10.x bump here hits the
      # same ERESOLVE from the other side (that was PR #4).
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
