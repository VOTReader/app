name: CI

# ── MAINTENANCE: Node 24 Actions migration — DONE 2026-06-03 ──
# GitHub is retiring the Node 20 Actions runtime (runs forced to Node 24 on
# 2026-06-16; Node 20 removed from runners 2026-09-16). Every `uses:` here and
# in deploy-web.yml was bumped to its current Node-24 major, verified against the
# GitHub releases API at fix time: checkout@v6, setup-node@v6, setup-python@v6,
# setup-java@v5, gradle/actions/setup-gradle@v6, cache@v5, upload-artifact@v7
# (deploy-web also: configure-pages@v6, upload-pages-artifact@v5, deploy-pages@v5).
# Only stable inputs are used, so the major jumps are behavior-compatible.
# Ref: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#
# ── Actions are SHA-PINNED (2026-07-30) ──
# Each `uses:` carries a full commit SHA with its tag in a trailing comment.
# A tag can be moved by whoever owns the action; a SHA cannot — and this repo
# is public, with deploy-web.yml publishing straight to the live PWA. Read the
# trailing comment for the human-facing version; Dependabot
# (.github/dependabot.yml) bumps SHA and comment together. Never hand-edit a
# SHA — repin from the API: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

# CI pipeline:
#   Q1   — build all 4 bundles, verify committed dist/ matches source, syntax-check src/
#   Q3.4 — lint gate: 0 errors enforced by eslint's default (any error → nonzero exit),
#          warning ceiling pinned by --max-warnings 0 (post-Q3.3e steady state).
#   Q4.1 — typecheck gate: `tsc --noEmit` against the Q4 scope (utils + stores +
#          hooks) with checkJs=true, strict=false. Same zero-tolerance discipline
#          as lint (any type error fails CI). Cross-bundle bare-name globals are
#          ambient-declared as `any` in tools/globals.generated.d.ts; not-yet-typed
#          stores/utils carry @ts-nocheck placeholders (lifted as Q4.2/Q4.3 land).
#   NK1  — Kotlin unit-test gate: `./gradlew :app:testDebugUnitTest` runs the
#          JUnit 5 + Robolectric suite (junit-vintage bridges JUnit 4 / JUnit 5
#          on the same platform). Zero-tolerance — any failing Kotlin test fails
#          CI. AGP 9.2.1 requires JDK 17+; we run JDK 21 to match the local
#          toolchain pinned in gradle/gradle-daemon-jvm.properties.

# A branch that lives in THIS repo fires both of these. `push` is the signal
# builders actually use (most branches here never open a PR at all), so it stays
# unfiltered; `pull_request` exists for the one case `push` does not cover — a PR
# from a fork, where no push event reaches this repo. Both jobs therefore carry an
# `if:` that skips the pull_request copy for same-repo branches. See the block on
# the build job for the measurement.
on:
  push:
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (2026-09-03). Both jobs only check out the
# repo and run gates, so the token needs nothing beyond reading it (the cache
# and upload-artifact actions use the runtime token, not this one). Before this
# block the scope lived only in Settings -> Actions on github.com, where
# flipping it to "read and write" is two clicks with no diff, no review and no
# CI signal -- and npm ci runs every dependency's lifecycle scripts under this
# token. deploy-web.yml declares its own (pages / id-token) block.
permissions:
  contents: read

# One CI run per ref at a time. A superseded push to a branch cancels the run it
# replaces (nobody was going to read that result); main never cancels, so every
# landed commit keeps a complete CI record beside its deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build + syntax-check
    runs-on: ubuntu-latest
    # Every PR opened here ran this whole chain TWICE. Measured, not inferred:
    # `gh pr checks 13` listed each check under two distinct run ids
    # (33872042913 and 33872045621). The `push` and `pull_request` events both
    # fire for a branch that lives in this repo, and the concurrency group above
    # keys on github.ref — refs/heads/<branch> for the push, refs/pull/<n>/merge
    # for the PR — so the two runs are in different groups and nothing dedupes
    # them. Dependabot is the only PR author here and its branches are in-repo,
    # so every bump paid double.
    #
    # A fork PR is the one case where `push` does NOT fire in this repo, so that
    # is exactly when the pull_request copy has to run. Skipping the job (rather
    # than dropping the trigger, or filtering `push` to main) keeps branch CI for
    # builders and keeps fork PRs gated.
    #
    # `build + syntax-check` is a REQUIRED status check on main, and the check
    # run this job publishes is keyed to the head SHA — the push run publishes it
    # for the same SHA, so the requirement is still satisfied on an in-repo PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node (pinned via .nvmrc — matches local)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'   # B2 — restore ~/.npm keyed on package-lock.json (skips re-fetch each push)

      # B2 — cache puppeteer's downloaded Chromium (~150 MB) keyed on the lockfile,
      # so `npm ci` reuses it across pushes instead of re-downloading the browser
      # the smoke:ci render walk drives. The path is puppeteer's default cache dir.
      - name: Cache puppeteer Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `npm run build` invokes `python tools/build.py` (which generates
      # bundle-a.js) — setup-python guarantees a `python` on PATH.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install dependencies (npm ci — exact lockfile)
        run: npm ci

      - name: Lint (0 errors + 0 warnings hard gate)
        # `npm run lint` chains `npm run lint:globals` (regenerates the
        # auto-globals list + the parallel TS ambient .d.ts) and
        # `eslint app/src/main/assets/src`. ESLint exits nonzero on ANY
        # error, and --max-warnings 0 means any new warning fails CI.
        # This is the permanent steady state after Q3.3e closed all 59
        # exhaustive-deps warnings (every remaining exception is a
        # documented `eslint-disable-next-line` with a named rationale).
        run: npm run lint -- --max-warnings 0

      - name: Validate data schemas (W9.1 — Format A)
        # `npm run validate:data` runs node tools/validate-schemas.js
        # --strict. Exits nonzero on any Format A schema error (missing
        # field, bad block/segment type, orphaned footnote ref, broken
        # prev/next chain) — the "valid JS but invalid letter" class the
        # syntax/parse checks can't see. Mirrors the pre-commit Step 1b
        # gate; fails fast (cheap) before the heavier typecheck/test/build.
        run: npm run validate:data

      - name: Check read-along offsets (audio-sync)
        # node tools/check-audio-sync.js: every shipped AUDIO_SYNC span must
        # start and end on a word boundary in the block's CURRENT rendered
        # textContent. Catches the class where the timing data and the render
        # domain drift apart and the wash paints mid-word — invisible to
        # smoke.js (which only checks the row's block exists) and to
        # validate:data (which has no AUDIO_SYNC coverage at all).
        run: npm run check:audio-sync

      - name: Check Bible verse timings (bible-sync — against the audio facts)
        # tools/validate-bible-sync.py --audio-facts: every chapter in
        # src/data/bible-sync-*.js has exactly one integer slot per verse of the
        # CURRENT corpus and its onsets never step backwards. The belt / audio /
        # rebuild proofs need the alignment belts and the local mp3s, which only
        # the aligning machine has -- the pre-commit hook runs those (full mode).
        #
        # AND the last onset of every chapter lies inside that chapter's audio.
        # Until this step changed, no gate that runs on a LANDING had ever checked
        # a shipped timing against its audio at all: --structural was passed here
        # and in ci-gates.sh deliberately, because the check reaches through a
        # .gitignore'd tools/_align-work/ into a drive no runner has, so FULL mode
        # was a sentence only the aligning machine could produce.
        # tools/audio-facts.json commits the FACTS instead -- per chapter: byte
        # size, duration, sha256, ffprobed and hashed from the mp3s themselves,
        # never derived from the belts (a sidecar taken from the belts agrees
        # with any belt including a wrong one, so it is green in exactly the case
        # it exists to catch). ~482 KB for both editions; it is
        # regenerated by tools/build-audio-facts.py whenever the audio changes and
        # AUDITED against the real files by pre-commit's FULL run, which reports
        # in its own mode line whether it audited them: FULL audits it, CI trusts
        # it.
        # THE LEGS THAT RUN HERE: every shipped chapter has an entry; every
        # entry NAMES the chapter it describes (a mis-keyed entry is a real
        # record pointing at the wrong file, and the asset id is the only
        # identity a clone can check); every last onset lies inside the
        # duration. Not the belts' audioSize -- tools/_align-work/ is
        # .gitignore'd, so there is nothing in the repo carrying one to compare
        # against; that leg is the FULL run's, on the machine that aligned.
        # WHAT THIS STILL CANNOT SEE, said here rather than left to be assumed:
        # CI checks facts ABOUT the audio and never the audio. A belt whose
        # onsets are all shifted two seconds but still inside the duration passes
        # every leg here; e2e:readalong is what catches that. Complements, not
        # substitutes.
        # Until c43 nothing read this file at all: check-audio-sync covers the
        # letters and validate:data never looks at it. Stdlib Python + node.
        # --all-editions discovers the files rather than naming one. Without it
        # this ran the brm-kjv default while the comment above claimed every
        # bible-sync-*.js, so the WEB edition now being aligned would have landed
        # a new timings file past a green gate that never opened it.
        run: python tools/validate-bible-sync.py --audio-facts --all-editions

      - name: Check audio renditions reach the app (audio-manifest)
        # node tools/check-audio-manifest.js: every reader who recorded a letter
        # must be OFFERED that letter, as the primary or as an alternate. The
        # manifest is generated, so a composition rule that drops a rendition
        # fails silently — it just prints a smaller number, and the flock's
        # reading is gone from the app. Checked against
        # tools/audio-manifest-coverage.json, written by the generator's MAPPING
        # stage, so a loss in the COMPOSITION stage is visible. Offline.
        run: npm run check:audio-manifest

      - name: Audit footnote rendering (CORP6 — dup / white verse numbers)
        # node tools/audit-footnotes.js --check: fails if any value that renders
        # through VerseWithNumbers would show a DUPLICATED or WHITE verse number
        # (the dup / bad-key / fallback classes). validate:data's
        # validateFootnoteMarkers covers the no-marker case; this is the unique
        # signal for the dup + label-suffixed-key cases. Runs with the data gates.
        # COVERAGE, corrected 2026-09-04 (data-corpus-7): the seven volumes,
        # lords-rebuke, letters-timothy, letters-flock, hidden-manna AND
        # holy-days (mixed-format, so `nkjv` or `scriptures` — its 21 values were
        # unchecked before), plus the wtlb-scriptures / the-blessed /
        # matthew-nkjv dicts. NOT the Matthew Study Bible's per-chapter
        # `scriptures`: those are { ref, cite } anchors into MATTHEW_NKJV, not
        # verse text, and validate-schemas.js gates their shape and their refs.
        run: npm run check:footnotes

      - name: Test + run the data gate (check_balance.py — T6)
        # The front-line black-screen / white-verse gate: esprima JS parse,
        # non-ASCII verse-range dashes, smart-quote JSON delimiters, brace
        # imbalance. T6 adds test_check_balance.py (stdlib unittest) so a
        # regression in the GATE ITSELF is caught — it was previously untested,
        # i.e. it could silently stop catching the bug class it exists for.
        # This step ALSO runs the gate over the real corpus in CI; before this
        # check_balance ran only in the pre-commit hook (bypassable via
        # --no-verify), so en-dash / smart-quote contamination could reach main.
        # esprima (the authoritative JS-syntax check) is pinned in
        # requirements-dev.txt; installing it makes the esprima cases real, not
        # skipped. Cheap + deterministic — runs before the heavier build.
        # test_requirements.py rides the same call (2026-09-04, process-hygiene-6):
        # the weekly Task Scheduler job runs fetch-drive-audio ->
        # gen-audio-manifest -> mirror-audio-release unattended, so a
        # third-party import that requirements-dev.txt does not pin is a
        # ModuleNotFoundError at step 1 and audio ingestion stops indefinitely
        # while the repo stays green. It reads imports with `ast`, installs
        # nothing, and keeps the heavy OCR dependencies out of that path.
        # test_batch_align_ship.py rides the same unittest call (2026-09-04):
        # batch-align.py rebuilds audio-sync.js volume by volume from its run
        # report, so a letter that RAISED or that align-supervisor.py skipped
        # for memory had its already-shipped read-along timings DELETED. No gate
        # sees that -- check-audio-sync.js validates the rows present and never
        # compares the file with its previous self, so a shorter audio-sync.js
        # is green. The shipper now carries such a key forward; the test also
        # proves the two deliberate drops (below the ship gate, gone from the
        # manifest) still drop, so carry-forward cannot rot into never deleting.
        # test_preview_server.py rides the same unittest call (2026-09-03):
        # tools/preview-server.py must bind 127.0.0.1 only. It bound every
        # interface for months and nothing said so; a dev server that can
        # LAN-expose the tree is a defect, so the contract is proven on every
        # push instead of assumed.
        # test_align_commit.py rides the same unittest call (2026-09-05): the
        # alignment runners print a per-unit COMMIT charge, and the reader took
        # PagefileUsage from the base PROCESS_MEMORY_COUNTERS instead of
        # PrivateUsage from the _EX struct. It printed 10.02 GB where the truth
        # was 17.29 GB -- self-consistent, plausible, and 40% low, on the number
        # another agent was using to size a memory ceiling. Only a second
        # instrument on the same PID caught it. Note this runner is ubuntu and
        # _self_mem returns 0.0 off Windows, so the EMPIRICAL half skips here;
        # what CI holds is the shape of the struct and of the reader, which is
        # exactly what the revert would break.
        # test_batch_align_bible_ship.py rides the same unittest call
        # (2026-09-05): batch-align-bible.py writes each belt row at
        # arr[n - 1] where n is the EDITION's verse number, which is SPARSE in
        # some editions, and ReadAlongHighlight reads position i back as verse
        # NUMBER i + 1. Two readers concluded the array was dense and wanted it
        # re-indexed by position; that would move every verse after a gap by one
        # for the rest of the chapter (WEB acts 8 has no :37, so verse 38 would
        # land at index 36) with every other gate green. The shipped brm-kjv
        # file cannot catch it -- KJV is dense in all 1,189 chapters, so both
        # shippers emit identical bytes -- so the test carries a real gapped
        # chapter of its own. (1,189, not the 1,161 this comment carried until
        # 2026-09-06: 1,161 is the chapter count of src/data/books.js, the canon
        # minus matthew-plain, whose 28 live in matthew.js. A correct count of
        # the neighbouring object survives every sanity check a made-up number
        # fails, which is why it reached four documents before anyone produced
        # the object it counted.)
        # test_audio_facts.py rides the same unittest call (2026-09-06): the
        # audio-facts sidecar and the --audio-facts mode above, with the arm that
        # makes the rest a measurement -- --structural over the SAME broken
        # fixture stays GREEN, so "the new gate is red" says something about the
        # gate rather than about the fixture.
        run: |
          pip install -r requirements-dev.txt
          python -m unittest test_check_balance test_preview_server test_requirements test_batch_align_ship test_batch_align_bible_ship test_align_commit test_audio_facts -v
          python check_balance.py

      - name: Check App() size budget (P11 canary)
        # `npm run check:app-size` fails if app.jsx exceeds its line budget.
        # Catches architectural drift — the composition root re-bloating —
        # which lint/typecheck/test/build don't see (app.jsx crept 797->838
        # unnoticed before this gate). New concerns belong in a hook under
        # src/hooks/, not inlined in App().
        run: npm run check:app-size

      - name: Typecheck (tsc --noEmit, Q4 scope)
        # `npm run typecheck` runs `tsc --noEmit` against tsconfig.json's
        # narrowed scope (utils + stores + hooks). Zero-tolerance from
        # day one — any type error fails CI.
        run: npm run typecheck

      - name: Smoke-lite (Node-runnable structural checks)
        # `node tools/smoke-lite.js` — the bridge between "smoke runs
        # in a browser" and "CI catches data/module regressions." Three
        # checks: globals mirror (gen-eslint-globals diff-check),
        # COLLECTIONS → data-file linkage, module-graph cycle detection.
        run: npm run smoke-lite

      - name: Test (vitest run --coverage, Q5 — typed hooks/stores/utils)
        # `npm run test:coverage` runs vitest with v8 coverage + the
        # coverage thresholds in vitest.config.js. Zero-tolerance: any
        # failing test OR any coverage % below the locked baseline fails
        # CI. Thresholds ratchet UPWARD only — see vitest.config.js
        # comments for the rule. Pre-commit runs this same `test:coverage`
        # script (C2-D [D1], 2026-08-10), so the floors are enforced at the
        # commit prompt as well as here; `npm run test` stays coverage-free
        # for the dev loop only.
        run: npm run test:coverage

      - name: Build all 4 bundles (tools/build.py + esbuild B/C/D)
        run: npm run build

      - name: Verify committed bundles + SW version + CSP hashes match source
        # After `npm run build` regenerates dist/, the CSP script-src hashes
        # (build:csp → index.html), and the SW CACHE_VERSION (build:sw), the
        # working tree should be byte-identical to the committed copies. Any
        # diff = committed dist/ bundles, index.html (stale CSP hashes), or
        # service-worker.js are stale relative to source. Catches what the hook
        # misses. index.html is included because build:csp may rewrite its CSP.
        run: git diff --exit-code app/src/main/assets/dist/ app/src/main/assets/index.html app/src/main/assets/service-worker.js

      - name: Verify CSP script-src hashes match inline scripts (U10)
        # --check (never writes): fails if index.html's committed script-src
        # sha256 allow-list doesn't match the sha256 of its inline <script>
        # blocks — i.e. an inline script changed without a re-hash, which would
        # hard-block that script under CSP (black-screen class) on the live PWA.
        run: npm run check:csp

      - name: Verify CORPUS_VERSION gate (U3)
        # The lazy corpus bundles (a-bible/matthew/vot) are SW-cached and busted
        # ONLY by a manual CORPUS_VERSION bump — CACHE_VERSION excludes them.
        # This gate (--check, never writes) fails if the committed
        # tools/corpus-version.lock doesn't match the freshly-built corpus
        # bundle hash, i.e. corpus DATA changed without bumping CORPUS_VERSION
        # (which would silently leave existing web clients on stale scripture).
        run: node tools/check-corpus-version.js --check

      - name: Verify drive-sourced Bible editions route to their declared tag
        # A Bible edition with a `driveFolder` ships opaque Drive ids and declares
        # its releaseTag, because nothing in such an id says which release it lives
        # on. If bibleAudioAssetUrl is not routing by that declared tag, the ids
        # fall through its asset-name prefix table to the append-only
        # audio-bible-v1 and every chapter 404s against a release that genuinely
        # exists — a real URL, a real tag, no asset.
        #
        # EXIT 2 IS A FAILURE, NOT A SKIP. The script exits 2 when it cannot
        # evaluate the manifest at all, distinct from 1 for "routing is wrong",
        # and `run:` fails the step on ANY non-zero status — which is the whole
        # point of putting it here. `e2e:readalong` exiting 2 with "no keys with
        # locally cached audio" was read as a skip by its runner on 2026-09-05,
        # so a gate that measured nothing reported green on the one branch that
        # touched the path.
        #
        # Keep this a BARE step, captured and never piped. Two edits would
        # silently discard the exit code and neither looks wrong: `|| true`, and
        # a pipe — `node tools/check-drive-edition-routing.mjs | tail` reports
        # tail's status, not the gate's, so a red gate reads green. A bare `node`
        # (or `npm run`, which propagates a non-zero status verbatim) is what
        # makes this gate cost nothing to keep correct.
        #
        # It is on the LANDING path deliberately, not in pre-commit: it is red
        # until the routing change lands, so it must block the merge without
        # blocking the commits that carry the edition. It lifts itself with no
        # marker to remove, and passes trivially while no drive edition exists.
        run: node tools/check-drive-edition-routing.mjs

      - name: Verify ASSET_INTEGRITY describes the assets on disk
        # service-worker.js REFUSES to install a build whose bytes disagree with its
        # generated ASSET_INTEGRITY map, so a stale map means no client can update at
        # all. The map is written by tools/sync-sw-version.js, and the "committed
        # dist/ matches the rebuild" diff below CANNOT catch a stale map: if an older
        # generator ran, it reproduces the committed file exactly and there is no
        # diff. This gate re-derives the hashes from the assets themselves, so it is
        # blind to which generator ran and only asks whether the map is TRUE.
        run: npm run check:asset-integrity

      - name: Verify MS_INDEX_VERSION was bumped when index-shaping code changed
        # The built MiniSearch index is persisted in IndexedDB (~21 MB) and keyed by
        # dataSignature(), which folds in MS_INDEX_VERSION but NOT the search code —
        # so changing the doc shape, the indexed fields or the tokenizer left every
        # client restoring an index the new builder would not produce. Worse than a
        # stale SW cache: it survives a hard reload AND clearing Cache Storage.
        # cache.js asked for a manual bump; nothing enforced it until this gate.
        run: npm run check:search-index

      - name: Verify every runtime src/ asset is derivable + staged by the deploy
        # deploy-web.yml excludes src/ (it is bundled into dist/) and copies a few
        # files back in. That copy-back was the hand-written glob
        # `src/data/bible-*.js` and it silently dropped src/data/scripture-web-data.js
        # — a 2.6 MB file ScriptureWebScreen injects via script.src — so the Scripture
        # Web would have 404'd on the live PWA while working in local preview.
        # Nothing failed; the file just wasn't there. This gate derives the runtime
        # asset list from the loaders in src/ and fails if one is missing from disk,
        # or if service-worker.js precaches a src/ path the scan cannot see.
        run: npm run check:runtime-assets

      - name: Verify every runtime-injected asset survives the APK ignore list
        # app/build.gradle.kts trims packaged assets via ignoreAssetsPatterns, a
        # basename match with no negative-include. `<dir>src` once removed the nine
        # alternate translations and Studies (~36 MB) and nothing failed loudly:
        # the loader's onerror fell back to NKJV. The pre-commit hook has run this
        # gate since; CI never did, so a --no-verify commit or a push from another
        # machine went unchecked here. The gate also refuses to pass vacuously now
        # (tools/check-apk-assets.test.js: no gradle block, or zero derived paths).
        run: npm run check:apk-assets

      - name: Verify every CSS custom-property reference resolves (C2-D [D8])
        # An undeclared var() with no fallback is invalid at computed-value
        # time — the whole declaration drops, so a border becomes `none`
        # rather than falling back to a colour. --border shipped that way,
        # referenced 13 times, declared nowhere, painting nothing.
        run: npm run check:css-tokens

      - name: Verify the dist/ byte budget (C2-D [D3])
        # Per-bundle byte ceilings ~15% over the size measured 2026-08-10.
        # Nothing watched dist/ bytes before this gate and bundle-d/-e grew
        # ~70%/~110% past their documented sizes across many green commits.
        # Runs after `npm run build` so it measures freshly-built output.
        run: npm run check:bundle-budget

      - name: Verify the type scale (one ladder, no literal font-sizes)
        # Every font-size must name a --fs-N / --fsc-N token defined once in
        # app.css :root, so Settings -> Text Size moves ALL type together and
        # nothing renders below the 10px floor. Literals fail the build.
        run: node tools/check-type-scale.js

      - name: Syntax-check every src/ module
        run: |
          # .js — Node's own parser. node --check cannot parse JSX, so
          # this pass is .js only (corpus data + un-converted modules).
          find app/src/main/assets/src -name '*.js' -print0 | xargs -0 -n1 node --check
          # .jsx — esbuild. JSX-aware, emits clean file:line errors;
          # node --check would reject the syntax outright. -r skips the
          # esbuild run on a tree that has no .jsx files yet.
          find app/src/main/assets/src -name '*.jsx' -print0 | xargs -0 -r -n1 npx esbuild --outfile=/dev/null --log-level=warning

      - name: Smoke render walk (headless — U16)
        # smoke-lite (above) is structural-only; this runs the REAL 13-screen
        # render walk + both annotation round-trips (tools/smoke.js) in headless
        # Chrome against the built bundles, catching the black-screen class no
        # other gate sees. Puppeteer's Chrome was fetched by `npm ci`;
        # smoke-ci.js launches it with --no-sandbox (required as the Actions
        # user) + pre-loads the lazy corpora so every screen has its data.
        run: npm run smoke:ci

      - name: End-to-end read detector
        # e2e-read-detector.mjs proves the read detector end to end in a real
        # compositing Chromium: completion, the ledger, the day bucket, and the
        # frontier set and cleared.
        #
        # It serves the assets itself on an OS-assigned port and sends
        # Cache-Control: no-store, so the walk always sees the bundles this job
        # just built. This step used to start `python tools/preview-server.py
        # 8097 ...` first and poll for it, because the script hardcoded that
        # port. That was removed on 2026-09-04: with a fixed port, four
        # concurrent servers all bound successfully (Python's http.server sets
        # allow_reuse_address) and the gate reported PASS while serving another
        # worktree's tree. Nothing to start means nothing to collide with.
        #
        # Its sibling `npm run e2e:readalong` is deliberately NOT here. It needs
        # locally cached audio (tools/hone-sample.mjs downloads it) and on a clean
        # machine exits 2 with "no keys with locally cached audio — nothing to
        # check". In CI that is a step that can only ever skip, and a gate that
        # always skips is worse than an absent one — it reads green. It stays a
        # local gate until CI has audio to run it against.
        run: npm run e2e:read

  kotlin-tests:
    name: Kotlin unit tests (NK1)
    runs-on: ubuntu-latest
    # Same duplicate-run condition as the build job above; see the block there.
    # GitHub Actions does not expand YAML anchors, so it is written out twice.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21 (matches gradle/gradle-daemon-jvm.properties)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cache the Gradle daemon's caches + wrapper download so subsequent
      # CI runs don't re-download AGP 9.2.1 + Robolectric every time.
      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Run :app:testDebugUnitTest (JUnit 5 + Robolectric)
        # Zero-tolerance gate. Any failing Kotlin test fails CI, mirroring
        # the JS-side vitest discipline. NK1 lands the smoke harness;
        # NK2-NK5 fill it with real test cases.
        run: ./gradlew :app:testDebugUnitTest

      - name: Report the Kotlin test totals (and refuse a silent skip)
        # The test task prints no total, so the suite's SIZE was invisible here:
        # a run that quietly stopped executing tests read exactly like a run that
        # passed them. CI is also the only place this count is trustworthy — a
        # local run writes into vot.buildDir, which every worktree on the
        # aligning machine copies from the same local.properties, so a number
        # read there can belong to another branch entirely.
        #
        # `skipped` is asserted at 0 on purpose. A JUnit assumption failure
        # (assumeTrue) marks a test skipped, and a skip is invisible to every
        # cache and up-to-date check in this pipeline — the build still says
        # SUCCESSFUL. app/src/test carries no skip markers today; this is what
        # keeps that true. Zero result files fails as well: a check that can
        # only pass vacuously is worse than no check.
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              sys.exit('no JUnit result files — the test task produced nothing to count')
          tests = failures = errors = skipped = 0
          for path in files:
              a = ET.parse(path).getroot().attrib
              tests += int(a.get('tests', 0))
              failures += int(a.get('failures', 0))
              errors += int(a.get('errors', 0))
              skipped += int(a.get('skipped', 0))
          print(f'Kotlin unit tests: {len(files)} suites, {tests} tests, '
                f'{failures} failures, {errors} errors, {skipped} skipped')
          if skipped:
              sys.exit(f'{skipped} test(s) skipped — an assumption failure is '
                       'invisible to every other gate in this pipeline')
          PY

      - name: Android Lint (NewApi / manifest checks — any error fails CI)
        # lintDebug aborts the build on any lint ERROR (warnings don't fail).
        # Added 2026-08-09 after an external audit found 6 NewApi errors —
        # one a real API 26-29 crash (MainActivity's Context.getDisplay) —
        # that no existing gate saw: this job ran tests but never lint.
        run: ./gradlew :app:lintDebug

      - name: Verify JaCoCo coverage floor (NK6)
        # Ratchet gate on the pure-JVM-tested classes (JsBridge,
        # BoundedLogTree). Floor lives in app/build.gradle.kts and only
        # ever moves up. See the comment block on the jacoco {} extension
        # for why StorageManager + framework-coupled classes are out of
        # scope here (Robolectric sandbox CL bypasses JaCoCo's agent;
        # those tests still RUN, just aren't COUNTED here).
        run: ./gradlew :app:jacocoTestReport :app:jacocoTestCoverageVerification

      - name: Upload test + coverage reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kotlin-test-and-coverage-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/
          retention-days: 14
