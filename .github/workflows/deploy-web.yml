name: Deploy Web (PWA → GitHub Pages)

# ── Actions are SHA-PINNED (2026-07-30) ──
# Every `uses:` below pins a full commit SHA with its version tag in a
# trailing comment. THIS workflow is why: it publishes straight to the live
# PWA the owner reads on, so a moved tag on a compromised action could
# poison what lands on his phone. A SHA cannot be moved. Read the comment
# for the human-facing version; Dependabot (.github/dependabot.yml) bumps
# the SHA and the comment together. Do not hand-edit a SHA — repin from the
# API (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
# (The Node 20 → 24 runtime migration this note used to track is DONE —
# see ci.yml's MAINTENANCE note.)

# W5.1 — publish the web-facing asset subtree to GitHub Pages.
#
# The app is static files; there is no server. Only app/src/main/assets/
# is web-facing. Within it, src/ (ES module sources), *.d.ts, and *.lnk are
# NOT runtime assets and are excluded — with ONE exception: the alternate
# Bible translations + bible-studies.js (src/data/bible-*.js). Those are
# loaded at runtime via <script src="src/data/bible-*.js"> (loadTranslation /
# loadBibleStudies) and are NOT bundled into dist/, so they must ship; the
# staging step copies them back in after the broad src/ exclusion. (The main
# corpus IS in the dist/ bundles, so the rest of src/ stays out.)
# dist/, fonts/ and icons/ ship wholesale. Root files do NOT ship as-is: four
# of them are concatenated into dist/bundle-a.js by tools/build.py and are
# never loaded standalone (app.css — index.html links dist/app.min.css —
# react.min.js, react-dom.min.js, search-data.js), and *.test.js is not app
# code at all. Those 636 KB were published for months because this step asked
# only what to EXCLUDE. It still excludes, but it no longer decides:
# list-runtime-src-assets.js --check --site now asserts the staged root
# POSITIVELY against the service worker's own CORE_ASSETS, in both directions,
# so an unlisted file stops the deploy instead of reaching the public site,
# and a missing one stops it instead of breaking every client's install.
#
# All in-app asset paths are relative (dist/bundle-a.js, fonts/..., etc.),
# and the SW + manifest use ./ scope, so serving from the
# /app/ subpath works with no base-path rewriting. The app
# never changes the URL path (history.pushState({}, '', '') only adds
# back-button entries), so no SPA 404 fallback is needed.
#
# ONE-TIME SETUP (repo owner): Settings → Pages → Source → "GitHub Actions".
# configure-pages (enablement: true) attempts this automatically; the manual
# flip is the fallback if the workflow token cannot enable Pages.

on:
  # TWO RELEASES A DAY (up1, 2026-10-23). Corbin: "VOTReader has been flashing 'VOTReader was
  # just updated' at me all day long ... have VOTReader clients just take updates like in the
  # morning and at night?" (DECISIONS 10-23, superseding 08-11's "any kind of change should
  # always automatically deploy": every change still deploys, at the next window). CI still runs
  # every test on every push, so a failure shows at once; only the publish waits for 06:00 and
  # 21:00 America/Denver. Cron is UTC, so each window lists both hours it can fall on (summer
  # time UTC-6, winter time UTC-7) and the gate's tools/release-window.mjs lets through the one
  # that is the Denver hour that day, read from the run's own cron line (a scheduled run often
  # starts late; the hour it starts in must not choose the window).
  #
  # What publishes is unchanged (ci10): the NEWEST commit on main whose CI is green
  # (tools/deploy-target.mjs), never older than what is live (the build-sha.txt floor). A window
  # with nothing new publishes nothing. Scheduled runs come only from the default branch, so a
  # fork's branch named main cannot wake one.
  #
  # Until 10-23 this ran on every completed CI run on main (workflow_run, 2026-09-24 v12-01);
  # that is what put a new build on readers' screens dozens of times a day.
  #
  # up2 (2026-10-23): GitHub dropped the 06:00 run (top-of-the-hour crons are the first it
  # sheds). Each window hour now has two runs off the hour, and the gate publishes once per
  # window: a run after the site already published since the window began skips. The
  # other offset's hour catches up a window that passed with nothing published, and so
  # does a dispatch with catchup=true. GitHub dropped both 21:xx crons on 10-23 as well, so
  # the PC sends that dispatch first (D:/Swarm/tools/main-ci-watch.py): at +10 min when no
  # run came, and again at +55 min when nothing published; the crons are the backup.
  schedule:
    - cron: '7 12 * * *'    # 06:07 MDT (07:07 MST: catch-up hour after nothing published)
    - cron: '37 12 * * *'   # 06:37 MDT
    - cron: '7 13 * * *'    # 06:07 MST (07:07 MDT: catch-up)
    - cron: '37 13 * * *'   # 06:37 MST
    - cron: '7 3 * * *'     # 21:07 MDT (the next UTC day)
    - cron: '37 3 * * *'    # 21:37 MDT
    - cron: '7 4 * * *'     # 21:07 MST (22:07 MDT: catch-up)
    - cron: '37 4 * * *'    # 21:37 MST
  # SHIP NOW, and the manual override: deploy HEAD of main now, between windows, for a live
  # break (a crash, data loss, the app won't open; the hub fires it), even though CI is red (a
  # flaky e2e, say). The build job re-proves the publish gates itself on this path.
  workflow_dispatch:
    inputs:
      catchup:
        description: 'Catch up a missed release window: the newest green commit (not HEAD), only if nothing published since the window began'
        type: boolean
        default: false

# Least privilege, split by job (2026-09-24, improvement sweep v10-01). The deploy
# job used to run `npm ci`, lint, typecheck, vitest and the build - every
# devDependency's code, lifecycle scripts included - while holding pages: write and
# id-token: write, the two permissions that publish to the live PWA. Now `build`
# runs all of that with contents: read and hands over the finished _site/ as the
# Pages artifact; `deploy` holds the publishing permissions and runs no repository
# code at all: no checkout, no npm, only GitHub's own Pages actions (SHA-pinned).
permissions: {}

# ONE deploy at a time, gate to publish (ci10). A run waits while another runs;
# a newer waiting run replaces an older waiting one, which is harmless now: every
# run picks the newest green commit when its gate starts, so the survivor
# publishes at least what the replaced one would have. A deploy never goes
# backwards: the gate publishes only a pick strictly newer than the live
# build-sha.txt (the floor; the run listing alone once answered stale), and
# serialized runs keep that floor current. One cost: a
# manual override still WAITING when a release window starts is replaced by that run,
# which publishes the newest green commit, not the red tip; dispatch it again.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # n7-05: a handful of API reads
    # up2: deployments: read, for when the site last published (a window is done once it has).
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout the picker from main (never from the run that woke this one)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            tools/deploy-target.mjs
            tools/release-window.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: When did the site last publish? (the newest successful github-pages deployment)
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Empty when the lookup fails: a window-hour run then publishes anyway, a catch-up run does not.
        run: |
          at=""
          for id in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=10" --jq '.[].id' 2>/dev/null); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state' 2>/dev/null || true)
            if [ "$state" = "success" ]; then
              at=$(gh api "repos/$REPO/deployments/$id" --jq '.created_at' 2>/dev/null || true)
              break
            fi
          done
          echo "last publish: ${at:-unknown}"
          echo "at=$at" >> "$GITHUB_OUTPUT"
      - name: Is this a release window? (06:00 / 21:00 Denver, once each; a dispatch always is)
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LAST_PUBLISH_AT: ${{ steps.last.outputs.at }}
          CATCHUP: ${{ github.event_name == 'workflow_dispatch' && inputs.catchup && 'true' || 'false' }}
        run: node tools/release-window.mjs
      - name: Pick the newest commit on main whose CI is green
        if: steps.window.outputs.due == 'true'
        # The ci9 refutation (2026-09-24) still holds: an older commit's CI re-run
        # must never publish over a newer build, and a tag or fork branch named main
        # must never publish at all. The picker takes only commits on main (an
        # ancestor of the tip) and the newest of them, so the re-run picks the newer
        # commit and the tag picks nothing. The manual path publishes its own commit
        # only when it is main's tip.
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIVE_SHA_URL: https://votreader.github.io/app/build-sha.txt
          # A catch-up dispatch picks like a window (the newest green commit), not the tip.
          DISPATCH_SHA: ${{ github.event_name == 'workflow_dispatch' && !inputs.catchup && github.sha || '' }}
        run: node tools/deploy-target.mjs

  build:
    needs: gate
    # First attempt only (the ci10 refutation): "Re-run failed jobs" keeps the gate's
    # old pick, so a re-run of an older run whose build or deploy failed would publish
    # its commit over a newer deploy. The next window re-picks anyway; to retry
    # by hand, dispatch the workflow (a fresh run, a fresh pick).
    if: needs.gate.outputs.publish == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15   # n7-05: npm ci + build + staging
    permissions:
      contents: read
    steps:
      - name: Checkout (exactly the SHA the gate picked; the dispatched tip on the manual path)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'   # B2 — restore ~/.npm keyed on package-lock.json

      - name: Set up Python (tools/build.py emits bundle-a)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'   # the version requirements-dev.txt is measured on (v12-06)

      - name: Install dependencies (npm ci — exact lockfile)
        run: npm ci

      - name: Gate — the publish checks, on the MANUAL path only (BLD-1 + BLD2)
        # On the scheduled path CI has already run every one of these, and
        # everything this list used to leave out (smoke:ci's black-screen walk, the
        # coverage floors, e2e:read, e2e:readalong, bible-sync, drive routing,
        # check:s22, the budgets), on this exact SHA: the gate picked it from main's
        # green CI runs, and that pick is the proof.
        # A manual dispatch has no CI run behind it - it is the override for a red
        # CI - so it re-proves the checks that decide whether the published bytes
        # are sound: the data gates (check_balance, schemas, corpus/search/audio
        # versions, footnotes, CSS tokens, CSP), lint, typecheck and vitest. A
        # non-zero exit stops the deploy before anything is published, and the site
        # stays on the prior good version (the safe failure mode).
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements-dev.txt   # esprima — check_balance's authoritative JS parse
          python check_balance.py --strict   # BLD3 — black-screen data gate (parse / en-dash / smart-quote)
          npm run smoke-lite             # BLD3 — globals mirror + COLLECTIONS linkage + module cycles
          npm run check:runtime-assets   # every runtime src/ asset is derivable (the staging gate's first half)
          npm run check:search-index     # MS_INDEX_VERSION bumped if index-shaping code changed (stale IDB index)
          npm run check:corpus           # CORPUS_VERSION covers the corpus bundles, src/data corpus files AND fonts/reading
          npm run validate:data          # Format A/B/C/D schema integrity
          npm run check:audio-sync       # read-along spans start/end on word boundaries in the CURRENT render domain (the stale-timing class)
          npm run check:css-tokens       # every CSS var() resolves -- an undeclared token drops its whole declaration
          npm run check:footnotes        # CORP6 — no dup/white footnote verse numbers
          npm run check:csp              # index.html inline-script CSP hashes in sync
          npm run lint -- --max-warnings 0   # BLD2 — 0 errors + 0 warnings
          npm run typecheck              # BLD2 — tsc --noEmit
          npm run test                   # BLD2 — full vitest suite

      - name: Build bundles + sync SW version
        # `npm run build` regenerates dist/ and syncs the SW CACHE_VERSION
        # from package.json (build:sw), so the deployed SW always carries
        # the right version regardless of the committed state.
        run: npm run build

      - name: Verify committed dist/ matches this build — PWA and APK must not diverge
        # THE DIVERGENCE GATE (2026-08-11). This deploy publishes what it just
        # REBUILT; the Android APK packages the dist/ bytes that are COMMITTED to
        # the repo. Those are two different artifacts from one commit, and nothing
        # here compared them — so a commit whose dist/ was stale (rebuilt but not
        # re-staged) would publish correct bytes to the web while the APK shipped
        # the old ones, from the same SHA. That is exactly the class that bit
        # dist/bundle-f.js: the build chain emitted it, .githooks/pre-commit never
        # staged it, and only ci.yml's identical check would have caught it — on a
        # branch whose commits were never pushed, so nothing ever ran.
        #
        # ci.yml runs this too, and the deploy now waits for it; it stays here
        # because these are the bytes about to be published (and the manual path
        # has no CI run behind it). A non-zero exit aborts before anything is
        # staged, leaving the site on the prior good version — the safe failure mode.
        #
        # index.html is included because build:csp may rewrite its CSP script-src
        # hashes; service-worker.js because build:sw rewrites CACHE_VERSION.
        # tools/check-build-committed.mjs (W73) checks the whole of
        # app/src/main/assets/, the tree the rsync below publishes, and fails on a
        # NEW untracked file too: the `git diff --exit-code` it replaced passed a
        # build output that was never committed, which then went to the web and
        # not into the APK. ci.yml runs the same script.
        run: npm run check:build-committed

      - name: Verify ASSET_INTEGRITY describes what is about to be published
        # The last gate before staging, and the one the diff above cannot replace.
        # service-worker.js refuses to install a build whose bytes disagree with its
        # ASSET_INTEGRITY map, so publishing a stale map would stop every client from
        # updating — the exact failure this deploy exists to prevent. The diff gate is
        # blind to it (an older generator reproduces the committed file byte-for-byte,
        # leaving no diff), so this re-derives the hashes from the built assets.
        run: npm run check:asset-integrity

      - name: Stage web-facing files into _site/
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='src' \
            --exclude='*.d.ts' \
            --exclude='*.lnk' \
            --exclude='*.test.js' \
            --exclude='/app.css' \
            --exclude='/react.min.js' \
            --exclude='/react-dom.min.js' \
            --exclude='/search-data.js' \
            app/src/main/assets/ _site/
          # Copy back the src/ files the app loads at RUNTIME (the alternate
          # translations, bible-studies.js, scripture-web-data.js) after the
          # blanket src/ exclusion above — the rest of src/ stays out.
          #
          # The list is DERIVED from the loaders in src/ by
          # tools/list-runtime-src-assets.js, not hand-written here. It used to be
          # the glob `cp src/data/bible-*.js`, which silently dropped
          # src/data/scripture-web-data.js (2.6 MB, injected via script.src by
          # ScriptureWebScreen) — the Scripture Web would have 404'd on the live
          # PWA while working perfectly in local preview, with nothing failing loudly.
          mkdir -p _site/src/data
          node tools/list-runtime-src-assets.js | while read -r rel; do
            mkdir -p "_site/$(dirname "$rel")"
            cp "app/src/main/assets/$rel" "_site/$rel"
          done
          # The floor for the next deploy's gate (ci10): the commit these bytes came
          # from. tools/deploy-target.mjs publishes only a pick strictly newer than it.
          git rev-parse HEAD > _site/build-sha.txt
          # Fail the deploy if any runtime asset did not land. This is the gate that
          # turns "silently 404s in production" into "the deploy stops".
          node tools/list-runtime-src-assets.js --check --site _site
          echo "Staged file count: $(find _site -type f | wc -l)"
          echo "Runtime src/data files staged: $(ls _site/src/data/ | wc -l)"

      - name: What's new (the reader-facing changes since the live build)
        # up1 (2026-10-23): the app says "Updated · What's new" once per release and opens this
        # list (utils/whats-new.js). tools/whats-new.mjs takes the feat/fix commits GitHub's
        # compare lists between the live build-sha.txt and this commit, in plain words, added to
        # the live list. Read-only token, no repository code beyond the tool; any failure keeps
        # the live list (or an empty one) and never stops the deploy.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          base=$(curl -fsS --max-time 20 https://votreader.github.io/app/build-sha.txt | tr -d '[:space:]') || base=''
          curl -fsS --max-time 20 https://votreader.github.io/app/whats-new.json -o "$RUNNER_TEMP/prev-whats-new.json" || echo '{}' > "$RUNNER_TEMP/prev-whats-new.json"
          BASE="$base" HEAD="$(git rev-parse HEAD)" node tools/whats-new.mjs --compare --prev "$RUNNER_TEMP/prev-whats-new.json" --out _site/whats-new.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    # The only job holding the publishing permissions. It runs no repository code:
    # no checkout, no npm - GitHub's own Pages actions, SHA-pinned, on the
    # artifact `build` uploaded.
    needs: build
    # First attempt only, like build: re-running just this job would publish the
    # older artifact the first attempt built.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10   # n7-05: the Pages actions only
    permissions:
      pages: write
      id-token: write
    # One deployment at a time: the workflow-level `concurrency` above.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5