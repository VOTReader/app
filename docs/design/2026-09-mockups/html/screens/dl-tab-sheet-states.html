<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><link rel="stylesheet" href="dl-common.css"><script src="../kit/kit.js"></script><script src="dl-icons.js"></script>
<style>
  .board-grid { grid-template-columns: repeat(3, 412px); gap: 30px 32px; }
  .stackcol { display: flex; flex-direction: column; gap: 30px; }
  .wide { grid-column: 1 / -1; }

  /* a sheet drawn on its own, at full size */
  .sheet.solo { position: relative; left: auto; right: auto; bottom: auto; width: 412px; box-shadow: 0 0 0 1px var(--hairline), var(--shadow); }
  /* part of a sheet */
  .frag { width: 412px; background: var(--surface); border-radius: 20px; padding: 2px 20px 14px; box-shadow: 0 0 0 1px var(--hairline), var(--shadow); }
  .frag .btn.block.cancel { margin-top: 10px; }

  /* the top of the overview, clipped like a phone */
  .ovtop { position: relative; width: 412px; height: 352px; border-radius: 26px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--hairline), var(--shadow); }
  .ovtop .scroll { overflow: visible; }
  .ovtop .confirm { margin: 4px 0 12px; }
  .btn.text.held { background: color-mix(in srgb, var(--accent) 13%, transparent); }

  /* toasts at full size */
  .toasts { display: flex; flex-direction: column; gap: 22px; }
  .toasts .tcap { font: 400 13px/1.35 var(--sans); color: var(--text-3); margin-top: 8px; }

  /* the overview with a toast riding above the New tab button */
  .ovtoast { position: absolute; left: 20px; right: 20px; bottom: 100px; z-index: 6; max-width: none; }

  /* card states */
  .cards { display: flex; gap: 24px; align-items: flex-start; }
  .cards .one { width: 180px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .cards .one .tab { width: 180px; }
  .cards .lab { font: 700 12px/1.3 var(--sans); color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }
  .cards .lab small { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; margin-top: 2px; font-size: 12px; }
  .tab.pressing { position: relative; background: var(--surface-2); }
  [data-theme="light"] .tab.pressing { background: var(--surface-3); }
  .tab.pressing .strip { background: var(--surface-3); }
  [data-theme="light"] .tab.pressing .strip { background: color-mix(in srgb, var(--surface-3) 70%, var(--text-3)); }
  .tab.pressing::after { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 58%; background: var(--accent); z-index: 3; }
  .noprev { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); opacity: .55; }
  .noprev .i { width: 34px; height: 34px; }
  .dragbox { position: relative; width: 250px; height: 300px; flex: none; }
  .dragbox .slotc { position: absolute; left: 0; top: 0; width: 180px; height: 260px; border-radius: 16px; background: var(--accent-soft);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
  .dragbox .tab.lifted { position: absolute; left: 44px; top: 30px; width: 180px; transform: scale(1.05); z-index: 4;
    box-shadow: 0 0 0 1.5px var(--accent), var(--shadow); }
  [data-theme="dark"] .dragbox .tab.lifted { background: var(--surface-2); }
  [data-theme="dark"] .dragbox .tab.lifted .strip { background: var(--surface-3); }
  [data-theme="light"] .dragbox .tab.lifted { box-shadow: 0 0 0 1.5px var(--accent), 0 18px 40px rgba(60,40,20,0.22); }
</style></head>
<body data-size="1380x1780">
<div class="board">
  <div class="board-head">
    <div class="h2">Tabs · actions, confirmations and card states</div>
    <div class="meta">The ⋮ on a card opens Tab actions. Closing several tabs at once has no undo, so those actions ask first, in place. A single × closes at once and offers Undo.</div>
  </div>
  <div class="board-grid" id="grid"></div>
</div>
<script>
  /* ---------- previews, exactly as screens/tabs.html ---------- */
  const PV = {
    home: `<div class="mph" style="width:56%;height:8px;border-radius:4px"></div><div class="mph" style="width:34%"></div>
      <div class="mcont"><div class="mm">Volume One</div><div class="ms">Letter 15</div><div class="mprog"><i style="width:38%"></i></div></div>
      <div class="mtiles"><span><b></b></span><span><b></b></span><span><b></b></span><span><b></b></span></div>`,
    letter: `<div class="mm">Volume One</div><div class="mt">Letter 15</div>
      <div class="mb"><div class="mph" style="width:100%"></div><div class="mph" style="width:95%"></div><div class="mph" style="width:98%"></div><div class="mph r" style="width:90%"></div><div class="mph r" style="width:62%"></div></div>
      <div class="mb"><div class="mph" style="width:100%"></div><div class="mph" style="width:93%"></div><div class="mph" style="width:97%"></div><div class="mph" style="width:70%"></div></div>
      <div class="mb"><div class="mph" style="width:99%"></div><div class="mph" style="width:88%"></div><div class="mph" style="width:95%"></div></div>`,
    john: `<div class="mt big">John 3</div><div class="mb">
      <div class="ln"><span class="vn">1</span><span class="mph" style="width:84%"></span></div><div class="ln"><span class="mph" style="width:100%"></span></div>
      <div class="ln"><span class="vn">2</span><span class="mph" style="width:62%"></span></div><div class="ln"><span class="mph" style="width:100%"></span></div>
      <div class="ln"><span class="mph" style="width:96%"></span></div><div class="ln"><span class="mph" style="width:48%"></span></div>
      <div class="ln"><span class="vn">3</span><span class="mph" style="width:40%"></span><span class="mph h" style="width:44%"></span></div>
      <div class="ln"><span class="mph h" style="width:100%"></span></div><div class="ln"><span class="mph h" style="width:36%"></span></div>
      <div class="ln"><span class="vn">4</span><span class="mph" style="width:80%"></span></div><div class="ln"><span class="mph" style="width:100%"></span></div>
      <div class="ln"><span class="mph" style="width:91%"></span></div><div class="ln"><span class="vn">5</span><span class="mph" style="width:74%"></span></div></div>`,
    web: `<div class="mph" style="width:50%;height:8px;border-radius:4px"></div><div class="mph" style="width:30%"></div>
      <svg class="arcs" viewBox="0 0 156 154"><line class="base" x1="2" y1="136" x2="154" y2="136"/>
      <path class="b" d="M8 136 A70 70 0 0 1 148 136"/><path class="b" d="M26 136 A42 42 0 0 1 110 136"/><path class="b" d="M88 136 A21 21 0 0 1 130 136"/>
      <path class="b" d="M110 136 A19 19 0 0 1 148 136"/><path class="b" d="M26 136 A9 9 0 0 1 44 136"/><path class="a" d="M8 136 A29 29 0 0 1 66 136"/>
      <path class="a" d="M44 136 A11 11 0 0 1 66 136"/><path class="a" d="M66 136 A41 41 0 0 1 148 136"/>
      <circle class="n" cx="8" cy="136" r="2.4"/><circle class="n" cx="26" cy="136" r="2.4"/><circle class="n" cx="44" cy="136" r="2.4"/><circle class="n on" cx="66" cy="136" r="3.2"/>
      <circle class="n" cx="88" cy="136" r="2.4"/><circle class="n" cx="110" cy="136" r="2.4"/><circle class="n" cx="130" cy="136" r="2.4"/><circle class="n" cx="148" cy="136" r="2.4"/></svg>`,
    none: `<div class="noprev"><i data-i="dl-sparkle" class="fill"></i></div>`,
  };
  const card = (pv, name, { cls = '', pin = false, extra = '' } = {}) =>
    `<div class="tab ${cls}"><div class="pv"><span class="tmenu"><i data-i="ellipsis-vertical" class="xs"></i></span>${PV[pv]}</div>
      <div class="strip">${pin ? '<i data-i="dl-pin" class="xs pin"></i>' : ''}<span class="nm">${name}</span><span class="x"><i data-i="x" class="xs"></i></span></div>${extra}</div>`;

  /* ---------- sheet pieces ---------- */
  const ai = (icon, label, desc, off = false) => `<div class="ai${off ? ' off' : ''}"><i data-i="${icon}" class="sm"></i><div class="at"><div class="al">${label}</div><div class="ad">${desc}</div></div></div>`;
  const confirm = (q, yes) => `<div class="confirm"><div class="q"><i data-i="dl-triangle-alert" class="sm"></i><span>${q}</span></div><div class="cacts"><span class="btn quiet sm">Cancel</span><span class="btn warn sm">${yes}</span></div></div>`;
  const R = { rename: ['square-pen', 'Rename tab…'], pin: ['dl-pin', 'Pin tab'], unpin: ['dl-pin', 'Unpin tab'], others: ['dl-copy-x', 'Close other tabs'], right: ['dl-arrow-right-to-line', 'Close tabs to the right'] };

  const sheetOthers = `<div class="sheet solo"><div class="grabber"></div><div class="eyebrow">Tab 2</div><div class="h2">Tab actions</div><div class="acts-list">
      ${ai(...R.rename, 'Give this tab a name of your own; it sticks until you clear it.')}
      ${ai(...R.pin, 'Moves this tab to the front and protects it from Close other tabs and Close all.')}
      <div class="confirm-wrap">${confirm('Close 3 other tabs?', 'Yes, close them')}</div>
      ${ai(...R.right, 'Close 2 tabs after this one.')}
    </div><span class="btn secondary block cancel">Cancel</span></div>`;

  const sheetPinned = `<div class="sheet solo"><div class="grabber"></div><div class="eyebrow">Tab 1</div><div class="h2">Tab actions</div><div class="acts-list">
      ${ai(...R.rename, 'Custom name: “Morning reading”. Clear the field to go back to the automatic name.')}
      ${ai(...R.unpin, 'Stops protecting this tab from bulk-close actions.')}
      ${ai(...R.others, 'Keep only this tab open. 3 other tabs will be closed.')}
      ${ai(...R.right, 'Close 3 tabs after this one.')}
    </div><span class="btn secondary block cancel">Cancel</span></div>`;

  const fragRight = `<div class="frag"><div class="acts-list">
      ${ai(...R.others, 'Keep only this tab open. 3 other tabs will be closed.')}
      <div class="confirm-wrap">${confirm('Close 2 tabs after this one?', 'Yes, close them')}</div>
    </div><span class="btn secondary block cancel">Cancel</span></div>`;

  const fragNone = `<div class="frag"><div class="acts-list">
      ${ai(...R.others, 'Keep only this tab open. No other tabs to close.', true)}
      ${ai(...R.right, 'No tabs to the right.', true)}
    </div></div>`;

  const closeAll = `<div class="ovtop"><div class="screen" style="height:352px">
      <div class="status"></div>
      <div class="topbar tabs-top"><span class="title">4 tabs</span><span class="btn text held">Close all</span></div>
      <div class="scroll">${confirm('Close all 4 tabs?', 'Yes, close all')}
        <div class="tgrid" style="padding-top:0">${card('home', 'Home')}${card('letter', 'Volume One&nbsp;· Letter 15', { cls: 'cur' })}</div>
      </div></div></div>`;

  const toasts = `<div class="toasts">
      <div><div class="toast"><span class="txt">Tab closed.</span><span class="act">Undo</span></div>
        <div class="tcap">After ×, for 6 seconds. Undo puts the tab back in its place.</div></div>
      <div><div class="toast"><span class="txt">Tab limit reached (50). Close a tab to open a new one.</span></div>
        <div class="tcap">Instead of a new tab, when 50 are open.</div></div>
    </div>`;

  const undoPhone = `<div class="phone-s"><div class="screen">
      <div class="status"></div>
      <div class="topbar tabs-top"><span class="title">3 tabs</span><span class="btn text">Close all</span></div>
      <div class="scroll"><div class="tgrid">${card('home', 'Home')}${card('letter', 'Volume One&nbsp;· Letter 15', { cls: 'cur' })}${card('web', 'Scripture Web')}</div></div>
      <div class="toast ovtoast"><span class="txt">Tab closed.</span><span class="act">Undo</span></div>
      <span class="btn primary newtab"><i data-i="plus" class="sm"></i>New tab</span>
    </div></div>`;

  const one = (lab, sub, html) => `<div class="one"><div class="lab">${lab}<small>${sub}</small></div>${html}</div>`;
  const cardsRow = `<div class="cards">
      ${one('Active', 'The tab on screen', card('letter', 'Volume One&nbsp;· Letter 15', { cls: 'cur' }))}
      ${one('Pinned', 'Kept by Close other tabs and Close all', card('john', 'John 3', { pin: true }))}
      ${one('Pressed', 'The line fills; at about 1.4 s it lifts', card('web', 'Scripture Web', { cls: 'pressing', extra: '<span class="touch" style="left:90px;top:120px"></span>' }))}
      ${one('No preview yet', 'Before the page has been captured', card('none', 'Answers'))}
      <div class="one" style="width:250px"><div class="lab">Dragging<small>Lifted over its landing place; the others move aside</small></div>
        <div class="dragbox"><div class="slotc"></div>${card('home', 'Home', { cls: 'lifted', extra: '<span class="touch" style="left:120px;top:110px"></span>' })}</div></div>
    </div>`;

  const cell = (cap, sub, html, cls = '') => `<div class="cell ${cls}"><div class="cap">${cap}<small>${sub}</small></div>${html}</div>`;
  document.getElementById('grid').innerHTML = [
    cell('Close other tabs · asks first', 'The row itself becomes the question. Pinned tabs stay open.', sheetOthers),
    cell('Pinned, with a name of its own', 'Tab 1 now: pinning moves a tab to the front', sheetPinned),
    `<div class="stackcol">${cell('Close tabs to the right · asks first', 'Only the tabs after this one; pinned ones stay', fragRight)}${cell('Nothing to close', 'The only tab, or the last one: the rows rest, greyed', fragNone)}</div>`,
    cell('Close all · asks first', 'From the top bar. Pinned tabs are kept; nothing closes until Yes', closeAll),
    cell('Toasts', 'Tab closed · Tab limit', toasts),
    cell('Undo, over the overview', 'The toast sits above New tab, never on it', undoPhone),
    cell('Tab cards', 'At full size. ⋮ opens Tab actions; × closes the tab at once', cardsRow, 'wide'),
  ].join('');
</script>
</body></html>
