<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<link rel="stylesheet" href="lb-common.css"><script src="lb-icons.js"></script>
<style>
  .tabs { margin-top: 16px; }
  .nbs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .nbc { position: relative; min-height: 124px; padding: 16px; border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; }
  [data-theme="light"] .nbc { box-shadow: 0 1px 2px rgba(60,40,20,.06); }
  .nbc .ic { color: var(--c, var(--accent)); }
  .nbc .chev { position: absolute; right: 12px; top: 15px; color: var(--text-3); }
  .nbc .eb { position: absolute; left: 50px; top: 18px; }
  .nbc .nm { margin-top: auto; padding-top: 14px; font: 500 20px/1.2 var(--serif); color: var(--text); }
  .nbc .dt { margin-top: 3px; font: 400 13px/1.35 var(--sans); color: var(--text-3); }
  .nbc.new .ic { color: var(--accent); }
  .nbc.new .nm { color: var(--accent); font: 700 16px/1.3 var(--sans); }
</style></head>
<body>
<div class="screen">
  <div class="status"></div>
  <div class="topbar">
    <span class="iconbtn"><i data-i="chevron-left"></i></span>
    <span class="title">Notes</span>
  </div>
  <div class="scroll">
    <div class="lb-head"><div class="tt"><span class="h1">Notes</span><span class="meta cnt">23</span></div></div>
    <div class="seg tabs"><span class="on">Notebooks</span><span>All notes</span></div>

    <div class="nbs">
      <div class="nbc" style="--c: var(--text-3)"><i data-i="lb-folder-open" class="ic"></i><span class="meta eb">Default</span><i data-i="chevron-right" class="sm chev"></i>
        <div class="nm">Uncategorized</div><div class="dt">5 notes</div></div>
      <div class="nbc" style="--c: var(--dot-honey)"><i data-i="lb-folder" class="ic"></i><i data-i="chevron-right" class="sm chev"></i>
        <div class="nm">Devotional</div><div class="dt">8 notes</div></div>
      <div class="nbc" style="--c: var(--dot-sage)"><i data-i="lb-folder" class="ic"></i><i data-i="chevron-right" class="sm chev"></i>
        <div class="nm">Sabbath study</div><div class="dt">6 notes</div></div>
      <div class="nbc" style="--c: var(--dot-sky)"><i data-i="lb-folder" class="ic"></i><i data-i="chevron-right" class="sm chev"></i>
        <div class="nm">Prophecy</div><div class="dt">4 notes</div></div>
      <div class="nbc"><i data-i="lb-folder" class="ic"></i><i data-i="chevron-right" class="sm chev"></i>
        <div class="nm">Questions</div><div class="dt">2 notes</div></div>
      <div class="nbc new"><i data-i="lb-folder-plus" class="ic"></i>
        <div class="nm">New notebook</div></div>
    </div>
  </div>
</div>
</body></html>
