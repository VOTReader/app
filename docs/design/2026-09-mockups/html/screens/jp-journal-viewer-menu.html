<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  .entry { padding-top: 6px; }
  .entry .date { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .entry .date .pin { color: var(--accent); }
  .para { margin-top: 26px; }
  .para > * + *, .para .ph + .ph { margin-top: 20px; }
  .line { display: flex; align-items: center; gap: 8px; height: 10px; }
  .line .ph { flex: none; margin: 0; }
  .iref { display: inline-flex; align-items: center; height: 28px; padding: 0 11px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font: 700 14px/1 var(--sans); white-space: nowrap; flex: none; }
  .blk { margin-top: 28px; }
  .emb { position: relative; padding: 16px 44px 18px 18px; }
  .emb .chev { position: absolute; right: 12px; top: 16px; color: var(--text-3); }
  .emb .txt { margin-top: 8px; font-size: 18px; line-height: 1.55; }
  .emb .top { display: flex; justify-content: space-between; gap: 12px; }
  .emb .h3 { margin-top: 6px; }
  .emb .tz { margin-top: 14px; }
  .emb .tz .ph { height: 8px; }
  .emb .tz .ph + .ph { margin-top: 11px; }
  .memo { display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; }
  .memo .pb { width: 44px; height: 44px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
  .memo .pb .i { margin-left: 2px; }
  .memo .mb { flex: 1; min-width: 0; }
  .wave { display: flex; align-items: center; justify-content: space-between; height: 26px; }
  .wave span { width: 3px; border-radius: 2px; background: var(--text-3); opacity: .75; }
  .memo .mm { display: flex; justify-content: space-between; margin-top: 6px; }
  /* back pill: arrived through a link from another entry */
  .backpill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 10px; border-radius: 20px; background: var(--surface-2); font: 400 14px/1 var(--sans); color: var(--text-3); margin: 2px 0 10px; }
  .backpill b { color: var(--text); font-weight: 700; }
  /* missing media: said in words, with nothing that would do nothing */
  .gone { height: 180px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); font: italic 400 16px/1.2 var(--serif); }
  .cap { margin-top: 12px; }
  .memo.miss { gap: 14px; }
  .memo.miss .ic { width: 44px; height: 44px; border-radius: 22px; background: var(--surface-2); color: var(--text-3); display: grid; place-items: center; flex: none; }
  .memo.miss .t1 { font: 400 15px/1.3 var(--sans); color: var(--text); }
  .memo.miss .t2 { margin-top: 3px; font: italic 400 16px/1.2 var(--serif); color: var(--text-3); }
  /* sheet */
  .sheet .item { display: flex; align-items: center; gap: 16px; min-height: 56px; font: 400 16px/1.2 var(--sans); color: var(--text); }
  .sheet .item .i { color: var(--text-2); }
  .sheet .item + .item { border-top: 1px solid var(--hairline); }
  .sheet .item.danger, .sheet .item.danger .i { color: var(--danger); }
  /* not found */
  .empty { text-align: center; padding: 150px 24px 0; }
  .empty .badge { width: 64px; height: 64px; border-radius: 32px; background: var(--surface-2); color: var(--text-3); display: grid; place-items: center; margin: 0 auto 18px; }
  .empty .body { margin-top: 8px; text-wrap: balance; }
</style></head>
<body data-size="1460x770">
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="x-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>
  <symbol id="x-image-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></symbol>
</svg>
<div class="board">
  <div class="board-head">
    <div class="h2">Journal · reading an entry</div>
    <div class="meta">The ⋮ menu (Open is hidden inside an entry), entry-to-entry links with their way back, media whose bytes are gone, and a deleted entry.</div>
  </div>
  <div class="board-grid" id="grid" style="grid-template-columns: repeat(5, 256px)"></div>
</div>
<script>
  const PIN = '<svg class="i xs pin"><use href="#x-pin"/></svg>';
  let waveBars = '';
  for (let i = 0; i < 40; i++) waveBars += `<span style="height:${6 + Math.round(Math.abs(Math.sin(i * 0.6 + i * 0.13)) * 16)}px"></span>`;
  const memo = (cap, len) => `<div class="blk card memo"><span class="pb"><i data-i="play" class="sm fill"></i></span>
      <div class="mb"><div class="wave">${waveBars}</div><div class="meta mm"><span>${cap}</span><span>0:00 / ${len}</span></div></div></div>`;
  function viewer({ title, date, body, pre = '', over = '', menu = true }) {
    return `<div class="phone-s"><div class="screen">
      <div class="status"></div>
      <div class="topbar"><span class="iconbtn"><i data-i="chevron-left"></i></span><span class="title">Journal</span>${menu ? '<span class="iconbtn"><i data-i="ellipsis-vertical"></i></span>' : ''}</div>
      <div class="scroll">${pre}
        ${title ? `<div class="entry"><div class="h1">${title}</div><div class="meta date">${date}</div></div>` : ''}
        ${body}
      </div>${over}
    </div></div>`;
  }
  const P4 = `<div class="para"><div class="ph" style="width:100%"></div><div class="line"><div class="ph" style="width:118px"></div><span class="iref">John 3:3</span><div class="ph" style="width:148px"></div></div><div class="ph" style="width:97%"></div><div class="ph" style="width:62%"></div></div>`;
  const P3 = (a, b, c) => `<div class="para"><div class="ph" style="width:${a}%"></div><div class="ph" style="width:${b}%"></div><div class="ph" style="width:${c}%"></div></div>`;
  const VERSE = `<div class="blk card emb"><div class="meta">John 3:3</div><div class="reading txt">Jesus answered and said to him, “Most assuredly, I say to you, unless one is born again, he cannot see the kingdom of God.”</div><i data-i="chevron-right" class="sm chev"></i></div>`;
  const cells = [
    ['Entry options', 'One ⋮ in the top bar; Edit lives here', viewer({
      title: 'Morning reading', date: `September 24, 2026 · 7:12 AM · ${PIN}Pinned`, body: P4 + VERSE + P3(98, 100, 44),
      over: `<div class="scrim"></div><div class="sheet"><div class="grabber"></div>
        <div class="item"><i data-i="square-pen"></i>Edit entry</div>
        <div class="item"><svg class="i"><use href="#x-pin"/></svg>Unpin entry</div>
        <div class="item danger"><i data-i="trash-2"></i>Delete entry</div></div>` })],
    ['A linked entry', 'Another entry, embedded as a card', viewer({
      title: 'Evening prayer', date: 'September 22, 2026 · 9:05 PM', body: P3(100, 93, 58) + memo('Voice memo', '1:36') +
        `<div class="blk card emb"><div class="meta">Linked Entry</div><div class="h3">Notes on Letter 15</div>
          <div class="tz"><div class="ph" style="width:100%"></div><div class="ph" style="width:70%"></div></div><i data-i="chevron-right" class="sm chev"></i></div>` + P3(96, 100, 31) })],
    ['Arriving through the link', 'One back pill; Back returns to the entry you came from', viewer({
      pre: `<span class="backpill"><i data-i="chevron-left" class="sm"></i>Back to <b>Evening prayer</b></span>`,
      title: 'Notes on Letter 15', date: 'September 19, 2026 · 6:48 AM', body: P3(100, 95, 71) +
        `<div class="blk card emb"><div class="top"><span class="meta">Volume One</span><span class="meta">12/13/04</span></div><div class="h3">Know That Which Has Been Poured Out, The Word of God</div><i data-i="chevron-right" class="sm chev"></i></div>` + P3(97, 100, 52) })],
    ['Media missing', 'Said in words; no play button, no duration', viewer({
      title: 'Sabbath', date: 'September 13, 2026 · 8:30 PM', body: P3(100, 88, 40) +
        `<div class="blk"><div class="gone"><svg class="i lg"><use href="#x-image-off"/></svg>Image missing</div><div class="ph cap" style="width:40%; height:8px"></div></div>
         <div class="blk card memo miss"><span class="ic"><i data-i="mic" class="sm"></i></span><div><div class="t1">Voice memo</div><div class="t2">Recording missing</div></div></div>` })],
    ['Entry not found', 'Opened from a link after the entry was deleted', viewer({
      menu: false, body: `<div class="empty"><div class="badge"><i data-i="notebook" class="lg"></i></div><div class="h2">Entry not found</div><div class="body">This journal entry may have been deleted.</div></div>` })],
  ];
  document.getElementById('grid').innerHTML = cells.map(c => `<div class="cell"><div class="cap">${c[0]}<small>${c[1] || '&nbsp;'}</small></div>${c[2]}</div>`).join('');
</script>
</body></html>
