<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<script src="../../../../../app/src/main/assets/src/data/scripture-web-data.js"></script>
<script src="sw-icons.js"></script>
<link rel="stylesheet" href="sw-common.css">
<style>
  /* dark in both themes, as in the app: the chrome, the strip and the key come from sw-lib.js, shared by every web page */
  .pop { width: 250px; }
  .pop q { display: block; font: italic 400 16px/1.4 var(--serif); color: var(--text-2); margin: 6px 0 10px; quotes: none; }
</style></head>
<body class="landscape" data-themes="dark">
<div class="ls" id="f"></div>
<script type="module">
  import { drawOverview, verseIndex, chromeHTML, footHTML, iconize, done } from './sw-lib.js';
  const f = document.getElementById('f');
  f.innerHTML = '<canvas></canvas>' + chromeHTML({}) + footHTML('canon') + `<div class="pop" id="pop">
      <div class="ref">Isaiah 53:5 <span>↕</span> 1 Peter 2:24</div>
      <q>“…And by His stripes we are healed.”</q>
      <span class="btn primary sm"><i data-i="book-open" class="sm"></i> Open in reader ›</span>
    </div>`;
  iconize();
  const a = verseIndex(22, 53, 5), b = verseIndex(59, 2, 24);
  const { X } = drawOverview(f.querySelector('canvas'), { top: 92, baseline: 346, sel: [a, b] });
  const pop = document.getElementById('pop');
  pop.style.left = Math.round(X(a) - 275) + 'px'; pop.style.top = '150px';
  done();
</script>
</body></html>
