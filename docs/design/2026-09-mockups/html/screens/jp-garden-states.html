<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<style>
  /* The photo viewer stays dark in both themes, as in the app: photographs read truest on black. */
  .gv { position: relative; height: 915px; background: var(--bg); overflow: hidden; }
  .gtop { position: absolute; left: 0; right: 0; top: 0; height: 72px; padding: 14px 12px 0; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .gtop .spacer { width: 44px; }
  .count { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--surface-2); display: inline-flex; align-items: center; gap: 4px; font: 700 15px/1 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; }
  .count span { font-weight: 400; color: var(--text-3); }
  .gimg { position: absolute; left: 0; right: 0; top: 72px; bottom: 104px; display: grid; place-items: center; overflow: hidden; }
  .photo { width: 412px; height: 549px;
    background:
      radial-gradient(38% 30% at 72% 18%, color-mix(in srgb, var(--dot-honey) 70%, transparent), transparent 100%),
      radial-gradient(70% 40% at 30% 72%, color-mix(in srgb, var(--dot-sage) 55%, transparent), transparent 100%),
      radial-gradient(50% 30% at 85% 88%, color-mix(in srgb, var(--dot-clay) 34%, transparent), transparent 100%),
      linear-gradient(180deg,
        color-mix(in srgb, var(--dot-sky) 34%, var(--surface-3)) 0%,
        color-mix(in srgb, var(--dot-honey) 20%, var(--surface-3)) 42%,
        color-mix(in srgb, var(--dot-sage) 34%, var(--surface-2)) 64%,
        color-mix(in srgb, var(--dot-sage) 22%, var(--surface)) 100%); }
  .photo.b { background:
      radial-gradient(45% 28% at 24% 22%, color-mix(in srgb, var(--dot-honey) 55%, transparent), transparent 100%),
      radial-gradient(60% 45% at 70% 70%, color-mix(in srgb, var(--dot-sage) 50%, transparent), transparent 100%),
      linear-gradient(180deg,
        color-mix(in srgb, var(--dot-honey) 22%, var(--surface-3)) 0%,
        color-mix(in srgb, var(--dot-sage) 26%, var(--surface-3)) 55%,
        color-mix(in srgb, var(--dot-clay) 22%, var(--surface-2)) 100%); }
  .photo.zoom { transform: scale(2.5) translate(-9%, 12%); }
  .gbot { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; padding: 0 28px 22px; display: flex; align-items: center; justify-content: space-between; z-index: 2; background: var(--bg); }
  .arrow { width: 56px; height: 56px; border-radius: 28px; background: var(--surface-2); color: var(--text); display: grid; place-items: center; }
  .arrow.off { opacity: .35; }
  .gbot .hint { font: 400 13px/1.3 var(--sans); color: var(--text-3); text-align: center; }
  .msg { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 0 44px; }
  .msg .i { color: var(--text-3); }
  .msg .t { font: 400 16px/1.45 var(--sans); color: var(--text-2); text-wrap: balance; }
  .spin { width: 30px; height: 30px; border-radius: 15px; border: 3px solid var(--surface-3); border-top-color: var(--accent); }
</style></head>
<body data-size="1176x760">
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="x-wifi-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></symbol>
</svg>
<div class="board">
  <div class="board-head">
    <div class="h2">A Return to The Garden · viewer states</div>
    <div class="meta">The app's one network feature. Pages stream and are cached; a failed page never dead-ends. The Before You Begin notice and the page-jump input are drawn separately.</div>
  </div>
  <div class="board-grid" id="grid" style="grid-template-columns: repeat(4, 256px)"></div>
</div>
<script>
  function viewer({ page, img, prevOff = false, nextOff = false }) {
    return `<div class="phone-s"><div class="screen"><div class="gv" data-theme="dark">
      <div class="gtop"><span class="iconbtn"><i data-i="chevron-left"></i></span><span class="count">${page}<span>/ 209</span></span><span class="spacer"></span></div>
      <div class="gimg">${img}</div>
      <div class="gbot"><span class="arrow ${prevOff ? 'off' : ''}"><i data-i="chevron-left"></i></span><span class="hint">A Return to The Garden</span><span class="arrow ${nextOff ? 'off' : ''}"><i data-i="chevron-right"></i></span></div>
    </div></div></div>`;
  }
  const cells = [
    ['Loading a page', 'Until the image arrives; the next pages load ahead', viewer({ page: 13, img: '<div class="msg"><span class="spin"></span><div class="t">Loading page 13…</div></div>' })],
    ['Offline or failed', 'One state for both; Try again fetches the page fresh', viewer({ page: 13, img: '<div class="msg"><svg class="i lg"><use href="#x-wifi-off"/></svg><div class="t">Failed to load — check your connection</div><span class="btn secondary sm">Try again</span></div>' })],
    ['Zoomed in', 'Pinch or double-tap (2.5×); swiping pauses while zoomed', viewer({ page: 13, img: '<div class="photo b zoom"></div>' })],
    ['The last page', 'Next rests at 209; Previous rests at page 1', viewer({ page: 209, img: '<div class="photo b"></div>', nextOff: true })],
  ];
  document.getElementById('grid').innerHTML = cells.map(c => `<div class="cell"><div class="cap">${c[0]}<small>${c[1]}</small></div>${c[2]}</div>`).join('');
</script>
</body></html>
