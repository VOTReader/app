<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><script src="../kit/kit.js"></script>
<script src="../../../../../app/src/main/assets/src/data/scripture-web-data.js"></script>
<script src="sw-icons.js"></script>
<link rel="stylesheet" href="sw-common.css">
<style>
  /* A thread tapped: the Connection sheet (ScriptureWebScreen.jsx DetailSheet). Its two ends side by side,
     From and To, each opening in the reader; Follow takes the camera to the far end. Dark in both themes. */
  .dsheet .hd { align-items: center; }
  .dsheet .hd .go { margin-left: auto; min-height: 0; }
  .dsheet .reading { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
</style></head>
<body class="landscape" data-themes="dark">
<div class="ls" id="f"></div>
<script type="module">
  import { drawOverview, highlight, verseIndex, chromeHTML, iconize, tok, done } from './sw-lib.js';
  const go = '<div class="acts"><span class="go">Open in reader ›</span></div>';
  const f = document.getElementById('f');
  f.innerHTML = '<canvas></canvas>' + chromeHTML({}) + `<div class="dsheet" role="dialog" aria-label="Connection details">
      <div class="grabber"></div><span class="iconbtn x"><i data-i="x"></i></span>
      <div class="hd"><span class="label">Connection</span><span class="meta">11,707 verses apart · weight 247</span><span class="go">Follow to 1 Peter 2:24 ›</span></div>
      <div class="cols pair">
        <div><div class="ce">From</div><div class="ref">Isaiah 53:5 <small>Old Testament · NKJV</small></div>
          <div class="reading">But He was wounded for our transgressions, He was bruised for our iniquities; The chastisement for our peace was upon Him, And by His stripes we are healed.</div>${go}</div>
        <div class="join"><i data-i="link"></i></div>
        <div><div class="ce">To</div><div class="ref">1 Peter 2:24 <small>New Testament · NKJV</small></div>
          <div class="reading">who Himself bore our sins in His own body on the tree, that we, having died to sins, might live for righteousness— by whose stripes you were healed.</div>${go}</div>
      </div>
    </div>`;
  iconize();
  const a = verseIndex(22, 53, 5), b = verseIndex(59, 2, 24);
  // the web stands back behind the sheet: a veil of the ground over full-strength ink (a low `dim` rounds the
  // faintest strokes into false hues), then the chosen thread in the selection look on top
  const cv = f.querySelector('canvas');
  const res = drawOverview(cv, { top: 80, baseline: 176 });
  const ctx = cv.getContext('2d');
  ctx.save(); ctx.globalAlpha = 0.62; ctx.fillStyle = tok('--bg', cv); ctx.fillRect(0, 0, cv.clientWidth, 176); ctx.restore();
  highlight(cv, res, 80, [[a, b]]);
  done();
</script>
</body></html>
