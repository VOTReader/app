<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><link rel="stylesheet" href="st-settings.css"><script src="../kit/kit.js"></script>
<style>
  .hero { text-align: center; padding: 34px 12px 0; }
  .hero .badge { width: 64px; height: 64px; border-radius: 32px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 18px; }
  .hero .body { margin-top: 10px; text-wrap: balance; }
  .hero .note-lead { font: 400 17px/1.5 var(--sans); color: var(--text-2); margin-top: 4px; }
  .acts { margin-top: 28px; }
</style></head>
<body data-size="412x915">
<!--st-icons--><svg xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="i-compass" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /> <circle cx="12" cy="12" r="10" /></symbol></svg><!--/st-icons-->
<div class="screen tall">
  <div class="status"></div>
  <div class="topbar">
    <span class="iconbtn"><i data-i="chevron-left"></i></span>
    <span class="title">Help</span>
  </div>
  <div class="scroll st">
    <div class="hero">
      <div class="badge"><i data-i="compass" class="lg"></i></div>
      <p class="body note-lead">A short tour of the app: eleven stops, about three minutes. It points at the real buttons; you can leave at any time.</p>
    </div>
    <div class="acts"><span class="btn primary block">Show me around</span></div>
  </div>
</div>
</body></html>
