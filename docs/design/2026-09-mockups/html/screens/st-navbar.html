<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css"><link rel="stylesheet" href="st-settings.css"><script src="../kit/kit.js"></script>
<style>
  .navset .set { padding: 12px 16px; }
  .navset .hd { min-height: 40px; }
  .navset .ico { color: var(--text); }
</style></head>
<body data-size="412x915">
<!--st-icons--><svg xmlns="http://www.w3.org/2000/svg" style="display:none"><symbol id="i-sun-moon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.9 4.9 1.4 1.4" /> <path d="m17.7 17.7 1.4 1.4" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.3 17.7-1.4 1.4" /> <path d="m19.1 4.9-1.4 1.4" /></symbol></svg><!--/st-icons-->
<div class="screen tall">
  <div class="status"></div>
  <div class="topbar">
    <span class="iconbtn"><i data-i="chevron-left"></i></span>
    <span class="title">Top-Nav Buttons</span>
  </div>
  <div class="scroll st">

    <div class="label sect first">Icons in the reading bar</div>
    <p class="lead-help" style="margin:0 2px 14px">Which optional icons appear in the top bar. On compact phones, History stays in Home to preserve full-size touch targets; Settings does the same below 340px.</p>
    <div class="group navset">
      <div class="set">
        <div class="hd"><span class="ico"><i data-i="settings" class="sm"></i></span><div class="txt"><div class="lbl">Settings Gear</div></div><span class="toggle on"></span></div>
      </div>
      <div class="set">
        <div class="hd"><span class="ico"><i data-i="history" class="sm"></i></span><div class="txt"><div class="lbl">History</div></div><span class="toggle on"></span></div>
      </div>
      <div class="set">
        <div class="hd"><span class="ico"><i data-i="bookmark" class="sm"></i></span><div class="txt"><div class="lbl">Bookmark</div></div><span class="toggle on"></span></div>
      </div>
      <div class="set">
        <div class="hd"><span class="ico"><i data-i="sun-moon" class="sm"></i></span><div class="txt"><div class="lbl">Theme</div></div><span class="toggle on"></span></div>
      </div>
    </div>

  </div>
</div>
</body></html>
