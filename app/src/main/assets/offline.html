<!DOCTYPE html>
<!-- Offline fallback (U18/U19): reachable only in a NARROW window — the SW
     serves this when a navigation request misses the cache AND the network is
     down. In practice index.html is itself a CORE_ASSET (precached), so once
     the app has been opened online, navigations succeed from cache and this
     page rarely shows. It's the first-visit-while-offline / cache-evicted
     safety net, not the normal offline experience (which is the cached app
     itself — scripture reads fully offline, and so do the songs a listener
     keeps (Songs of the Letters, K1); the Garden's GitHub-hosted images and
     the songs not kept stay online-only, by design). -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEC-1: this is the one served HTML document outside index.html's hash-locked
       CSP. It renders zero dynamic content and loads nothing external, so lock it down
       hard — no scripts at all (the retry control is a plain link, below). No frame-ancestors:
       browsers ignore it in a meta tag (it is header-only), so it promised nothing (sweep mw12). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>VOTReader — Offline</title>
  <style>
    /* WS6 (mock sy-offline): the empty-state pattern. No scripts and nothing external (SEC-1), so the faces are the system's. */
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; color: #ece6da; text-align: center; padding: 2rem; box-sizing: border-box; font-family: system-ui, sans-serif; }
    .offline-card { max-width: 340px; display: flex; flex-direction: column; align-items: center; }
    .icon { width: 48px; height: 48px; border-radius: 14px; background: #1c1b18; color: #d6b35f; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-family: Georgia, serif; font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.5; color: rgba(236,230,218,0.62); margin: 0 0 20px; }
    .retry { display: inline-flex; align-items: center; min-height: 44px; padding: 0 30px; border-radius: 999px; background: #d6b35f; color: #1a1408; font-size: 15px; font-weight: 600; text-decoration: none; }
    .retry:active { filter: brightness(0.9); }
  </style>
</head>
<body>
  <div class="offline-card">
    <span class="icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="0.8" fill="currentColor"/></svg></span>
    <h1>You are offline</h1>
    <p>Open VOTReader once while connected to the internet, and everything you read after that opens without a connection.</p>
    <a class="retry" href="./index.html">Try again</a>
  </div>
</body>
</html>
