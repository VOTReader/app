<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scripture Web harness</title>
<!-- TEMPORARY verification harness for the real renderer modules. Not shipped. -->
<link rel="stylesheet" href="dist/app.min.css">
<style>
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #ui{z-index:2} #gl{z-index:1}
  #hud{position:fixed;left:20px;top:16px;z-index:5;pointer-events:none;
    font-family:Cinzel,Georgia,serif;color:var(--gold);font-size:15px;letter-spacing:.18em}
  #stat{position:fixed;left:20px;bottom:14px;z-index:5;color:var(--cream-muted);
    font-size:11px;font-family:ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums}
  #bar{position:fixed;right:20px;top:14px;z-index:5;display:flex;gap:8px}
  button{background:transparent;color:var(--cream-dim);border:1px solid var(--gold-border);
    border-radius:999px;padding:0 14px;min-height:34px;font-family:Cinzel,Georgia,serif;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
  #tip{position:fixed;z-index:6;pointer-events:none;opacity:0;background:var(--bg3);
    border:1px solid var(--gold-border);border-radius:6px;padding:11px 13px;
    font-family:'EB Garamond',Georgia,serif;color:var(--cream-dim);font-size:15px}
  #tip .l{font-family:Cinzel,Georgia,serif;color:var(--gold-dim);font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
  #tip b{color:var(--gold-bright)}
  #tip .m{color:var(--cream-muted);font-size:12px;margin-top:8px}
</style>
<div id="wrap"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>
<div id="hud">THE SCRIPTURE WEB</div>
<div id="bar">
  <button id="dens">Classic</button>
  <button id="mode">Colour · Distance</button>
  <button id="theme">Light</button>
</div>
<div id="tip"></div>
<div id="stat">loading…</div>
<script src="src/data/scripture-web-data.js"></script>
<script type="module">
import { decodeGraph, minVotesFor } from './src/utils/scripture-web/decode.js';
import { createCamera, clampCamera, fitPPV, verseToX, xToVerse, zoomAbout,
  localizeFactor, squashFactor } from './src/utils/scripture-web/geometry.js';
import { pickArc, pickChapter, refOfVerse, chapterRange, countTouching }
  from './src/utils/scripture-web/pick.js';
import { createRenderer, COLOR_MODES, DENSITY_STEPS }
  from './src/ui/scripture-web/web-renderer.js';
import { readChromeTokens } from './src/utils/scripture-web/palette.js';

const g = decodeGraph(window.SCRIPTURE_WEB_DATA);
g.chunkSize = window.SCRIPTURE_WEB_DATA.chunkSize;
const glc = document.getElementById('gl'), uic = document.getElementById('ui');
const ux = uic.getContext('2d'), tip = document.getElementById('tip');
const renderer = createRenderer(glc, g);
if (!renderer) { document.getElementById('stat').textContent = 'WebGL2 unavailable'; throw 0; }

const cam = createCamera(g.total);
let W = 0, H = 0, DPR = 1, density = 'classic', colorMode = 'distance', light = false;
let focusArc = -1, focusRange = null, chrome = readChromeTokens();
const BASE = () => H - 78 * DPR;
const CEIL = () => (H - 78 * DPR) * 0.94;
const view = () => ({
  width: W, height: H, base: BASE(), ceil: CEIL(),
  squash: squashFactor(CEIL(), W), localize: localizeFactor(cam.ppv / fitPPV(cam, W)),
  density, rulerDepth: 60 * DPR,
});

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  glc.width = uic.width = W; glc.height = uic.height = H;
  if (!(cam.ppv > 0)) cam.ppv = fitPPV(cam, W);
  clampCamera(cam, W, 5000); schedule();
}
let raf = 0, fps = 0, frames = 0, fpsT = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };

function draw() {
  const zoom = cam.ppv / fitPPV(cam, W);
  const v = view();
  const stats = renderer.draw(Object.assign({}, v, {
    camX: cam.x, ppv: cam.ppv,
    strokeWidth: Math.min(0.8 + Math.log2(zoom) * 0.24, 3.0) * DPR,
    alpha: Math.min(0.065 + Math.log2(zoom) * 0.045, light ? 0.8 : 0.55),
    colorMode, density, light, bg: chrome.bg, focusRange, focusArc,
  }));
  overlay(zoom);
  frames++;
  const now = performance.now();
  if (now - fpsT > 500) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  document.getElementById('stat').textContent =
    `${stats.instances.toLocaleString()} arcs drawn · ${stats.draws} draws · ` +
    `${fps.toFixed(0)} fps · ${zoom.toFixed(1)}× zoom · ${density}`;
}

function overlay(zoom) {
  ux.clearRect(0, 0, W, H);
  const base = BASE();
  const ink = chrome.isLight ? '58,37,16' : '235,231,222';
  const gold = chrome.isLight ? '122,92,16' : '232,192,80';
  if (cam.ppv < 8 * DPR) {
    for (const [bi, cn, s, nv] of g.chapters) {
      const x = verseToX(cam, W, s), x2 = verseToX(cam, W, s + nv);
      if (x2 < -4 || x > W + 4) continue;
      ux.fillStyle = `rgba(${ink},${bi < 39 ? .55 : .8})`;
      ux.fillRect(x, base + 2 * DPR, Math.max((x2 - x) * .8, .7 * DPR), 2 * DPR + nv * .22 * DPR);
    }
  } else {
    const v0 = Math.max(0, Math.floor(xToVerse(cam, W, -10)));
    const v1 = Math.min(g.total - 1, Math.ceil(xToVerse(cam, W, W + 10)));
    ux.fillStyle = `rgba(${ink},.6)`;
    for (let v = v0; v <= v1; v++) ux.fillRect(verseToX(cam, W, v) - .75 * DPR, base + 2 * DPR, 1.5 * DPR, 9 * DPR);
    if (cam.ppv > 34 * DPR) {
      ux.font = `${9.5 * DPR}px Georgia,serif`; ux.fillStyle = `rgba(${ink},.6)`; ux.textAlign = 'center';
      for (let v = v0; v <= v1; v++) ux.fillText(String(refOfVerse(g, v).verse), verseToX(cam, W, v) + cam.ppv / 2, base + 14 * DPR);
    }
  }
  ux.strokeStyle = `rgba(${gold},.30)`; ux.lineWidth = DPR;
  ux.beginPath(); ux.moveTo(0, base + 1.5 * DPR); ux.lineTo(W, base + 1.5 * DPR); ux.stroke();
  // book labels
  const span = [];
  for (const [bi, , s, nv] of g.chapters) { span[bi] = span[bi] || [s, s + nv]; span[bi][1] = s + nv; }
  ux.textBaseline = 'top'; ux.textAlign = 'center';
  ux.font = `600 ${10.5 * DPR}px Cinzel,Georgia,serif`;
  for (let bi = 0; bi < span.length; bi++) {
    const [s, e] = span[bi], x = (verseToX(cam, W, s) + verseToX(cam, W, e)) / 2;
    const w = verseToX(cam, W, e) - verseToX(cam, W, s);
    if (x < -90 || x > W + 90) continue;
    ux.strokeStyle = `rgba(${gold},.22)`;
    ux.beginPath(); ux.moveTo(verseToX(cam, W, s), base + 2 * DPR); ux.lineTo(verseToX(cam, W, s), base + 8 * DPR); ux.stroke();
    const label = w > 82 * DPR ? g.books[bi].title.toUpperCase() : w > 30 * DPR ? g.books[bi].abbr.toUpperCase() : null;
    if (!label) continue;
    ux.fillStyle = `rgba(${ink},.86)`;
    ux.fillText(label, Math.max(Math.min(x, W - 40 * DPR), 40 * DPR), base + 30 * DPR);
  }
}

const wrap = document.getElementById('wrap');
let drag = null, moved = false;
wrap.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, camx: cam.x }; moved = false; wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener('pointermove', (e) => {
  if (drag) {
    if (Math.abs(e.clientX - drag.x) > 3) moved = true;
    cam.x = drag.camx - (e.clientX - drag.x) * DPR / cam.ppv;
    clampCamera(cam, W, 5000); schedule(); return;
  }
  hover(e);
});
wrap.addEventListener('pointerup', (e) => { if (drag && !moved) hover(e, true); drag = null; });
wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomAbout(cam, W, e.clientX * DPR, Math.exp(-e.deltaY * 0.0021), 5000);
  schedule();
}, { passive: false });

let hoverT = 0;
function hover(e, force) {
  const now = performance.now();
  if (!force && now - hoverT < 33) return; hoverT = now;
  const px = e.clientX * DPR, py = e.clientY * DPR, v = view();
  const ci = pickChapter(g, cam, v, px, py);
  if (ci >= 0) {
    const [lo, hi] = chapterRange(g, ci);
    focusRange = [lo, hi]; focusArc = -1;
    const ch = g.chapters[ci];
    tip.innerHTML = `<div class="l">Chapter</div><b>${g.books[ch[0]].title} ${ch[1]}</b>` +
      `<div class="m">${ch[3]} verses · ${countTouching(g, lo, hi, density).toLocaleString()} connections</div>`;
    place(e); schedule(); return;
  }
  const hit = pickArc(g, cam, v, px, py, 7 * DPR);
  if (!hit) { tip.style.opacity = 0; if (focusArc >= 0 || focusRange) { focusArc = -1; focusRange = null; schedule(); } return; }
  focusArc = hit.index; focusRange = null;
  tip.innerHTML = `<div class="l">Connection</div><b>${refOfVerse(g, hit.from).label}</b><br>` +
    `<b style="color:var(--link-blue)">${refOfVerse(g, hit.to).label}</b>` +
    `<div class="m">${Math.abs(hit.to - hit.from).toLocaleString()} verses apart · weight ${hit.votes}</div>`;
  place(e); schedule();
}
function place(e) {
  tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 16, innerWidth - 300) + 'px';
  tip.style.top = Math.min(e.clientY + 16, innerHeight - 140) + 'px';
}
document.getElementById('dens').onclick = (e) => {
  density = DENSITY_STEPS[(DENSITY_STEPS.indexOf(density) + 1) % 3];
  e.target.textContent = density[0].toUpperCase() + density.slice(1); schedule();
};
document.getElementById('mode').onclick = (e) => {
  colorMode = COLOR_MODES[(COLOR_MODES.indexOf(colorMode) + 1) % 3];
  e.target.textContent = 'Colour · ' + colorMode[0].toUpperCase() + colorMode.slice(1); schedule();
};
document.getElementById('theme').onclick = (e) => {
  light = !light; document.body.classList.toggle('light', light);
  chrome = readChromeTokens(); e.target.textContent = light ? 'Dark' : 'Light'; schedule();
};
addEventListener('resize', resize);
resize();
setInterval(schedule, 500);
window.__harness = { g, cam, view, pickArc, refOfVerse, fitPPV, zoomAbout, clampCamera,
  set density(d) { density = d; schedule(); }, get density() { return density; },
  set colorMode(m) { colorMode = m; schedule(); }, get colorMode() { return colorMode; },
  renderer, get W() { return W; }, get DPR() { return DPR; } };
</script>
